name: Ghost fleet data rebuild
on:
  schedule: [{cron: "41 5 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ghost-fleet-rebuild}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install h3 shapely
      - name: Reference layers, ownership, GPS interference (each keeps old file on failure)
        run: |
          python3 ghost-fleet/_src/layers.py || true
          python3 ghost-fleet/_src/owners.py || true
          python3 ghost-fleet/_src/jam.py || true
      - name: Fetch Global Fishing Watch events (keeps previous data on failure)
        env: {GFW_API_TOKEN: "${{ secrets.GFW_API_TOKEN }}"}
        run: python3 ghost-fleet/_src/fetch.py
      - run: python3 ghost-fleet/_src/build.py
      - run: python3 ghost-fleet/_src/palette_check.py
      - name: Commit if data changed (only ghost-fleet/data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ghost-fleet/data
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "Ghost fleet: rebuild data $(date -u +%F)"
          git pull --rebase && git push
