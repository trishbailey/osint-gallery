name: Belt and Road data rebuild
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
  push:
    paths: ["belt-and-road/_src/**"]
permissions: {contents: write}
concurrency: {group: belt-and-road-rebuild}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 belt-and-road/_src/build.py
      - name: Commit if data changed (only belt-and-road/data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- belt-and-road/data/belt_and_road.csv; then echo "no data change"; exit 0; fi
          git add belt-and-road/data
          git commit -m "Belt and Road: rebuild data $(date -u +%F)"
          git pull --rebase && git push
