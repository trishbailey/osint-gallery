name: sync-dashboards
# Pulls each live dashboard's main branch (see dashboards.json), builds it,
# and commits the output into /<slug>/. Render auto-deploys beacon-tools on push.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # off-minute: GitHub drops many :00/:15 runs
  workflow_dispatch:
    inputs:
      slugs: {description: "Space-separated slugs (blank = all)", required: false, default: ""}
  repository_dispatch:
    types: [dashboard-updated]
  push:
    branches: [main]
    paths: ["dashboards.json", "scripts/sync_dashboards.py", ".github/workflows/sync-dashboards.yml"]
permissions:
  contents: write
concurrency: {group: sync-dashboards, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: GitHub SSH known_hosts (from api.github.com/meta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/meta | python3 -c "import json,sys;print(chr(10).join('github.com '+k for k in json.load(sys.stdin)['ssh_keys']))" > "$RUNNER_TEMP/gh_known_hosts"
          echo "GITHUB_KNOWN_HOSTS_FILE=$RUNNER_TEMP/gh_known_hosts" >> "$GITHUB_ENV"
      - name: Build dashboards into subpaths
        env:
          DEPLOY_KEY_WORLD_BRIEF: ${{ secrets.DEPLOY_KEY_WORLD_BRIEF }}
          DEPLOY_KEY_CRITICAL_MINERALS: ${{ secrets.DEPLOY_KEY_CRITICAL_MINERALS }}
        run: python3 scripts/sync_dashboards.py ${{ github.event.inputs.slugs }} ${{ github.event.client_payload.slug }}
      - name: Commit if changed
        run: |
          git config user.name "beacon-dashboard-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No dashboard changes"; exit 0; fi
          git commit -m "Sync dashboards: $(cat */.source 2>/dev/null | tr '\n' ' ')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push raced with another commit; retry $i"; sleep $((i*5))
          done
          exit 1
