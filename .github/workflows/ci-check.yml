name: ci-check
# One check on every change: retired GA tag, github.io / old onrender links,
# shared-file edits without Trish's OK, and colour / label-size / 390px phone checks
# on the dashboards a change touches (every dashboard when the checks or shared files change).
# Browser and click checks run one job per dashboard, in parallel, so a full re-check
# finishes in about the time of the slowest dashboard instead of the sum of all of them.
# The checks themselves are the same, including per-button waits. Run manually with all=true for a full audit.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Browser-check every dashboard (full audit)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-check-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.set.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: set
        env:
          SHARED_OK: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'trish-approved') && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          source scripts/ci_args.sh
          slugs=$(python scripts/ci_check.py --list-plan "${CI_ARGS[@]}")
          python -c 'import json,sys; json.loads(sys.argv[1])' "$slugs"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "browser jobs: $slugs"
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Self-test the checks (must catch look-alike colours, number badges, short text, dead buttons)
        run: python scripts/test_ci_check.py
      - name: Static checks and figure tests
        env:
          SHARED_OK: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'trish-approved') && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          source scripts/ci_args.sh
          # Figure tests stay here (they are not the slow part). Browser and click checks are the matrix.
          python scripts/ci_check.py --static-only "${CI_ARGS[@]}"
  browser:
    needs: plan
    if: needs.plan.outputs.slugs != '[]' && needs.plan.outputs.slugs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Browser and click checks
        env:
          SHARED_OK: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'trish-approved') && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          source scripts/ci_args.sh
          # --no-static / --no-figures: those already ran in the static job. Click checks still
          # run only for a dashboard whose folder changed, which --one keeps.
          python scripts/ci_check.py --one "${{ matrix.slug }}" --no-static --no-figures "${CI_ARGS[@]}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-screens-${{ matrix.slug }}
          path: ci-screens/
          if-no-files-found: ignore
  check:
    needs: [plan, static, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every part passed
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "plan=$PLAN static=$STATIC browser=$BROWSER"
          test "$PLAN" = success
          test "$STATIC" = success
          test "$BROWSER" = success -o "$BROWSER" = skipped