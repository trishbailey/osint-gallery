name: Ghost fleet AIS (aisstream.io)
# Disabled in effect until the repo secret AISSTREAM_API_KEY exists: the job is skipped.
on:
  schedule: [{cron: "23 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ghost-fleet-ais, cancel-in-progress: false}
env: {HAS_KEY: "${{ secrets.AISSTREAM_API_KEY != '' }}"}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip cleanly without AISSTREAM_API_KEY
        if: env.HAS_KEY != 'true'
        run: echo "AISSTREAM_API_KEY secret not set; skipping."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with: {python-version: "3.12"}
      - name: Stream for ~5 minutes (200 MMSIs per subscription)
        if: env.HAS_KEY == 'true'
        env: {AISSTREAM_API_KEY: "${{ secrets.AISSTREAM_API_KEY }}"}
        run: |
          pip install -q websockets
          python3 ghost-fleet/_src/fetch_aisstream.py ghost-fleet/data/vessels.json ghost-fleet/data/positions 300
      - name: Commit only if new rows (only ghost-fleet/data/positions)
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ghost-fleet/data/positions
          if git diff --cached --quiet; then echo "no new rows"; exit 0; fi
          git commit -m "Ghost fleet: aisstream AIS positions $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i*10)); done; exit 1
