<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>t</title><style>body{margin:0;padding:20px;font:16px sans-serif;background:#0b1526;color:#eee}#out{padding:8px}.on{background:#2e7d32}svg{display:block}.hit{cursor:pointer}</style></head><body><main>
<svg width="300" height="100"><circle class="hit" aria-label="Basin A" cx="50" cy="50" r="30" fill="#1565c0" onclick="document.getElementById('out').textContent='Basin A opened'"/><rect class="hit" aria-label="Basin B" x="120" y="20" width="60" height="60" fill="#c62828" onclick="this.setAttribute('fill','#f9a825');document.getElementById('out').textContent='Basin B opened'"/></svg>
<div id="out">Click a basin</div>
<button id="b" onclick="this.classList.toggle('on')">Toggle layer</button>
</main></body></html>
